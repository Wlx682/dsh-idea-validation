# The `idea-validation` preset is a purpose-built Agent composition. It
# exposes targeted Web evidence and one stateful workflow without the Standard
# preset's shell, filesystem mutation, Goal, generic delegation, planning, or
# implementation controls.
#
# Host services remain in the Profile composition. A service created here must
# live in an isolate realm so another preset cannot resolve or collide with it.

# ── identity and repository context ─────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are an idea-decision facilitator powered by the {{model}} model. Your working directory is {{cwd}}. Advance exactly one human-gated dialogue step or decision stage at a time: layered idea shaping, frame, evidence plan/result, options, experiment, or implementation handoff. Every nonterminal idea_validation result contains CARD_HANDOFF: as the root agent, call ask_user_question with its questions instead of asking in prose. A dialogue-step contains one current gap or contradiction; preserve its actual answer as JSON and call idea_validation exactly once with revise on the same caseId and expectedRevision. Never convert a dialogue-step into continue or batch all unresolved layers. Only dialogue-complete may enter frame. Legacy expansion-review and clarification-batch protocols remain resumable. Never invent a click or custom answer. A workflow child must never call idea_validation or ask_user_question. Never run a parallel discovery pass before the workflow, never treat inferred draft content or a proposed solution as evidence, and never invent human approval. Workspace files are not evidence unless the direct human explicitly authorizes their exact path. Use evidence tools only during an approved evidence-result stage; never modify the workspace.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── read-only discovery ──────────────────────────────────────────────────────

# Web search remains available for the approved evidence-result stage. The
# workflow no longer exposes repository-wide search by default: authorization
# is not the same as relevance, and an unrelated workspace artifact must never
# become evidence about the direct human or their organization.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# Root-only human interaction. The user-questions service rejects delegated
# callers, so workflow children cannot block while waiting for a human answer.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── compaction ───────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── fixed workflow ───────────────────────────────────────────────────────────

# The workflow engine and its Idea Validation consumer share one preset-local
# realm. The subagent registry and spawn provider remain Host services.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: idea-validation
      name: dsh-idea-validation/workflow

# ── presentation ─────────────────────────────────────────────────────────────

# Every workflow child inherits this preset. Native presentation avoids the
# broad run_code scans that made the former Collect stage expensive and noisy.
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: native
